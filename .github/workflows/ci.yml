name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest (24.04) no longer provisions Python 3.9 from the toolcache, so the
    # 3.9 leg runs on 22.04 where it is available. Keeping 3.9 in the matrix matters:
    # the skeleton claims 3.9+ and that claim should be tested, not assumed.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all modules
        run: python -m compileall -q proposals/mcp-skeleton/continuity

      - name: Run the suite (ResourceWarnings are errors)
        working-directory: proposals/mcp-skeleton
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Secret scan
        run: python tools/secret_scan.py

      - name: Docs must not drift from code
        run: python tools/claim_check.py
